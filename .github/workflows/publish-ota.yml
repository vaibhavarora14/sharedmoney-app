name: Publish OTA Update

# On-demand EAS Update only. Do not publish on every merge to main.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS Update channel (preview first; production is explicit)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      message:
        description: "Update message shown in the Expo dashboard"
        required: true
        type: string
      git_ref:
        description: "Git ref to publish from (branch, tag, or SHA)"
        required: true
        default: "main"
        type: string

concurrency:
  group: publish-ota-${{ github.event.inputs.channel }}-${{ github.event.inputs.git_ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: eas update (${{ github.event.inputs.channel }})
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Validate secrets and resolve runtime version
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          # eas update is not an EAS build — app.config.js only fills owner/
          # projectId from env or EAS_BUILD (keeps Expo Go / OSS forks clean).
          EXPO_OWNER: varora1406
          EAS_PROJECT_ID: afddb7db-3d7d-46da-a1b5-0d6e4b4374ce
        run: |
          set -euo pipefail
          for var in EXPO_TOKEN EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_API_URL; do
            if [ -z "${!var}" ]; then
              echo "❌ $var is not set in the Production environment"
              exit 1
            fi
          done
          VERSION=$(node -p "require('./version.json').version")
          BUILD=$(node -p "require('./version.json').buildNumber")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "RUNTIME_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "📦 Publishing OTA for SharedMoney ${VERSION} (build ${BUILD})"
          echo "   runtimeVersion (appVersion policy): ${VERSION}"
          echo "   channel: ${{ github.event.inputs.channel }}"

      - name: Publish EAS Update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_URL: ${{ secrets.EXPO_PUBLIC_APP_URL }}
          EXPO_PUBLIC_DEFAULT_CURRENCY: ${{ secrets.EXPO_PUBLIC_DEFAULT_CURRENCY }}
          SENTRY_ORG: jobappagent
          SENTRY_PROJECT: react-native
          # Match submit-mobile / deploy-mobile: eas update does not set EAS_BUILD.
          EXPO_OWNER: varora1406
          EAS_PROJECT_ID: afddb7db-3d7d-46da-a1b5-0d6e4b4374ce
          OTA_CHANNEL: ${{ github.event.inputs.channel }}
          OTA_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail
          # --environment production loads EAS server-side env vars (incl.
          # EXPO_PUBLIC_SENTRY_DSN, which has no GitHub secret) so OTA bundles
          # match native production builds. Server values override step env.
          eas update --channel "$OTA_CHANNEL" --message "$OTA_MESSAGE" --environment production --non-interactive
          echo ""
          echo "✅ Published to channel ${OTA_CHANNEL}"
          echo "   runtimeVersion: ${RUNTIME_VERSION}"
          echo "   dashboard: https://expo.dev/accounts/varora1406/projects/share-money/updates"
          {
            echo "### OTA update"
            echo ""
            echo "- channel: **${OTA_CHANNEL}**"
            echo "- runtimeVersion (appVersion): \`${RUNTIME_VERSION}\`"
            echo "- marketing version: \`${VERSION}\` / build \`${BUILD}\`"
            echo "- message: ${OTA_MESSAGE}"
            echo "- dashboard: https://expo.dev/accounts/varora1406/projects/share-money/updates"
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload the OTA bundle's source maps so Sentry can symbolicate JS errors
      # from EAS Update builds (native builds upload via the Expo plugin).
      # Per @sentry/react-native ~7.11 Expo docs: run after `eas update`, which
      # leaves bundles + maps in ./dist. Best-effort only: never block an OTA.
      - name: Upload source maps to Sentry
        continue-on-error: true
        working-directory: mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: jobappagent
          SENTRY_PROJECT: react-native
          SENTRY_URL: https://sentry.io/
        run: |
          set -uo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning title=Sentry source maps skipped::SENTRY_AUTH_TOKEN is not set; OTA published without Sentry source maps."
            exit 0
          fi
          if [ ! -d dist ]; then
            echo "::warning title=Sentry source maps skipped::mobile/dist not found after eas update; nothing to upload."
            exit 0
          fi
          if npx --no-install sentry-expo-upload-sourcemaps dist; then
            echo "✅ Uploaded OTA source maps to Sentry (${SENTRY_ORG}/${SENTRY_PROJECT})"
            echo "- Sentry source maps: uploaded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Sentry source map upload failed::sentry-expo-upload-sourcemaps failed; OTA is published, but JS stack traces may be unsymbolicated."
            echo "- Sentry source maps: **upload failed** (see warning)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
