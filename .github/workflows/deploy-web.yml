name: Deploy Expo Redirect

# Push trigger removed: fails with "EAS project not configured".
# Manual-only until resolved, see https://github.com/onima-tech/sharedmoney-app/issues/401
on:
  workflow_dispatch:
    # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: Production
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          # eas-cli is required by `npm run deploy:web` (`npx eas deploy`);
          # it is not a workspace dependency, so without this the deploy step
          # fails with "could not determine executable to run".
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        working-directory: mobile
        run: npm ci

      - name: ✅ Pre-deployment validation
        working-directory: mobile
        run: |
          echo "🔍 Running pre-deployment checks..."
          
          # Check for required environment variables
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ EXPO_TOKEN secret is not set"
            exit 1
          fi
          
          # Verify package.json scripts exist
          if ! grep -q '"deploy:web:expo-redirect"' package.json; then
            echo "❌ deploy:web:expo-redirect script not found in package.json"
            exit 1
          fi

          if ! grep -q '"export:web:expo-redirect"' package.json; then
            echo "❌ export:web:expo-redirect script not found in package.json"
            exit 1
          fi
          
          echo "✅ Pre-deployment validation passed"

      - name: 🚀 Export and Deploy Expo Redirect
        working-directory: mobile
        run: npm run deploy:web:expo-redirect
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🏥 Post-deployment health check
        run: |
          echo "🏥 Running post-deployment health checks..."
          
          echo "✅ Legacy Expo redirect deployment completed."
          echo ""
          echo "**Next steps:**"
          echo "1. Verify https://share-money.expo.app redirects to https://sharedmoney.app/app"
          echo "2. Verify path-preserving redirects for /groups/:id and /join/:token"
          
          # Add deployment summary
          echo "## ✅ Expo Redirect Deployment Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The legacy Expo redirect artifact has been deployed to production via EAS." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Please verify:**" >> $GITHUB_STEP_SUMMARY
          echo "- https://share-money.expo.app redirects to https://sharedmoney.app/app" >> $GITHUB_STEP_SUMMARY
          echo "- Legacy deep-link paths are preserved" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
