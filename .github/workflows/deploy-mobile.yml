name: Deploy Mobile (Android + iOS)

# Tag pushes are the reliable release trigger for automation tokens that
# cannot call workflow_dispatch (403).
#
# Tags:
#   vX.Y.Z         -> build android + ios
#   android-vX.Y.Z -> android only
#   ios-vX.Y.Z     -> ios only
on:
  push:
    tags:
      - "v*"
      - "android-v*"
      - "ios-v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios
      submit:
        description: "Submit builds to App Store / Play Store after success"
        required: true
        default: true
        type: boolean
      submit_profile:
        description: "EAS submit profile (Android uses Internal first; use store only for an intentional public rollout)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - store
      create_github_release:
        description: "Create GitHub release with Android artifact"
        required: true
        default: true
        type: boolean
      git_ref:
        description: "Git ref to build from (branch, tag, or SHA)"
        required: true
        default: "main"
        type: string

concurrency:
  group: deploy-mobile-${{ github.event.inputs.git_ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release options
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.resolve.outputs.platform }}
      submit: ${{ steps.resolve.outputs.submit }}
      submit_profile: ${{ steps.resolve.outputs.submit_profile }}
      create_github_release: ${{ steps.resolve.outputs.create_github_release }}
      git_ref: ${{ steps.resolve.outputs.git_ref }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve inputs / tag
        id: resolve
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.git_ref || github.ref }}"
          PLATFORM="${{ github.event.inputs.platform || '' }}"
          if [ -z "$PLATFORM" ]; then
            case "${{ github.ref_name }}" in
              ios-v*) PLATFORM=ios ;;
              android-v*) PLATFORM=android ;;
              *) PLATFORM=all ;;
            esac
          fi
          SUBMIT="${{ github.event.inputs.submit || 'true' }}"
          SUBMIT_PROFILE="${{ github.event.inputs.submit_profile || 'internal' }}"
          CREATE_GH="${{ github.event.inputs.create_github_release || 'true' }}"

          if [ "$PLATFORM" = "all" ]; then
            MATRIX='[{"platform":"android"},{"platform":"ios"}]'
          elif [ "$PLATFORM" = "android" ]; then
            MATRIX='[{"platform":"android"}]'
          else
            MATRIX='[{"platform":"ios"}]'
          fi

          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "submit=$SUBMIT" >> "$GITHUB_OUTPUT"
          echo "submit_profile=$SUBMIT_PROFILE" >> "$GITHUB_OUTPUT"
          echo "create_github_release=$CREATE_GH" >> "$GITHUB_OUTPUT"
          echo "git_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved platform=$PLATFORM matrix=$MATRIX ref=$REF"

  build:
    name: EAS ${{ matrix.platform }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.git_ref }}
          fetch-depth: 0

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        working-directory: mobile
        run: npm ci

      - name: ✅ Validate secrets and version
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          for var in EXPO_TOKEN SENTRY_AUTH_TOKEN EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_API_URL; do
            if [ -z "${!var}" ]; then
              echo "❌ $var is not set in the Production environment"
              exit 1
            fi
          done
          VERSION=$(node -p "require('./version.json').version")
          BUILD=$(node -p "require('./version.json').buildNumber")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "📦 Releasing SharedMoney ${VERSION} (build ${BUILD}) for ${{ matrix.platform }}"

      - name: 🔧 Inject client env into EAS production profile
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_URL: ${{ secrets.EXPO_PUBLIC_APP_URL }}
          EXPO_PUBLIC_DEFAULT_CURRENCY: ${{ secrets.EXPO_PUBLIC_DEFAULT_CURRENCY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: jobappagent
          SENTRY_PROJECT: react-native
        run: |
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const env = eas.build.production.env || {};
          const keys = [
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_ANON_KEY',
            'EXPO_PUBLIC_API_URL',
            'EXPO_PUBLIC_APP_URL',
            'EXPO_PUBLIC_DEFAULT_CURRENCY',
            'EXPO_PUBLIC_SENTRY_DSN',
            'SENTRY_ORG',
            'SENTRY_PROJECT',
          ];
          for (const key of keys) {
            if (process.env[key]) env[key] = process.env[key];
          }
          env.EAS_BUILD = 'true';
          delete env.EXPO_PUBLIC_USE_DEV_CLIENT;
          eas.build.production.env = env;
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          console.log('Injected EXPO_PUBLIC_* and Sentry org/project into eas.json production profile');
          NODE

      - name: 🚀 EAS production build
        id: build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: jobappagent
          SENTRY_PROJECT: react-native
          # eas submit runs outside EAS_BUILD; app.config.js only fills owner /
          # projectId from env or EAS_BUILD (keeps Expo Go / OSS forks clean).
          EXPO_OWNER: varora1406
          EAS_PROJECT_ID: afddb7db-3d7d-46da-a1b5-0d6e4b4374ce
        run: |
          set -euo pipefail
          PLATFORM="${{ matrix.platform }}"
          SUBMIT="${{ needs.resolve.outputs.submit }}"
          SUBMIT_PROFILE="${{ needs.resolve.outputs.submit_profile }}"

          ARGS=(--platform "$PLATFORM" --profile production --non-interactive --wait --json --clear-cache)
          # Build first (no auto-submit) so a store agreement failure cannot
          # obscure a successful binary. Submit is a separate step below.

          echo "Running: eas build ${ARGS[*]}"
          set +e
          eas build "${ARGS[@]}" > ../eas-build-output-${PLATFORM}.json
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "❌ eas build failed with exit code $STATUS"
            echo "---- eas-build-output-${PLATFORM}.json ----"
            cat "../eas-build-output-${PLATFORM}.json" || true
            exit "$STATUS"
          fi
          echo "Build JSON written to eas-build-output-${PLATFORM}.json"

          if [ "$SUBMIT" = "true" ]; then
            BUILD_ID=$(node -e '
              const fs=require("fs");
              const d=JSON.parse(fs.readFileSync("../eas-build-output-'"$PLATFORM"'.json","utf8"));
              const b=(Array.isArray(d)?d:[d])[0]||{};
              if(!b.id) process.exit(1);
              process.stdout.write(b.id);
            ')
            echo "📤 Submitting build ${BUILD_ID} with profile ${SUBMIT_PROFILE}..."
            set +e
            eas submit --platform "$PLATFORM" --id "$BUILD_ID" --profile "$SUBMIT_PROFILE" --non-interactive --wait
            SUBMIT_STATUS=$?
            set -e
            if [ "$SUBMIT_STATUS" -ne 0 ]; then
              echo "⚠️ eas submit failed (exit ${SUBMIT_STATUS}). Binary is available; retry after fixing store agreements:"
              echo "   eas submit --platform ${PLATFORM} --id ${BUILD_ID} --profile ${SUBMIT_PROFILE} --non-interactive"
              # Soft-fail: keep the job green when only submission is blocked
              # (e.g. unsigned Apple Developer agreement).
            else
              echo "✅ Submit completed for ${PLATFORM}"
            fi
          fi

      - name: 📤 Export build metadata
        id: meta
        if: always()
        run: |
          set -euo pipefail
          PLATFORM="${{ matrix.platform }}"
          FILE="eas-build-output-${PLATFORM}.json"
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD:-unknown}" >> "$GITHUB_OUTPUT"
          mkdir -p build-meta
          if [ -s "$FILE" ] && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$FILE" >/dev/null 2>&1; then
            cp "$FILE" "build-meta/${PLATFORM}.json"
            PLATFORM="$PLATFORM" FILE="$FILE" node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync(process.env.FILE, 'utf8'));
          const builds = Array.isArray(data) ? data : [data];
          const b = builds[0] || {};
          const status = (b.status || 'unknown').toLowerCase();
          const platform = (b.platform || process.env.PLATFORM).toLowerCase();
          const url = b.artifacts?.buildUrl || b.artifacts?.applicationArchiveUrl || '';
          fs.writeFileSync('build-meta/' + platform + '-status.txt', status);
          if (platform === 'android' && url) {
            fs.writeFileSync('build-meta/android-artifact-url.txt', url);
          }
          let summary = '### ' + platform + ' build\\n\\n';
          summary += '- status: **' + status + '**\\n';
          summary += '- id: `' + (b.id || '?') + '`\\n';
          if (url) summary += '- artifact: ' + url + '\\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.replace(/\\n/g, '\n'));
          NODE
          else
            echo "No valid EAS build metadata for ${PLATFORM}"
            echo "missing" > "build-meta/${PLATFORM}-status.txt"
          fi

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-meta-${{ matrix.platform }}
          path: build-meta/
          if-no-files-found: ignore

  github-release:
    name: Publish GitHub release
    needs: [resolve, build]
    if: ${{ always() && needs.resolve.outputs.create_github_release == 'true' && (needs.resolve.outputs.platform == 'all' || needs.resolve.outputs.platform == 'android') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.git_ref }}
          fetch-depth: 0

      - name: Download Android build metadata
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: eas-meta-android
          path: build-meta

      - name: Skip if Android did not produce an artifact
        id: check
        run: |
          if [ -f build-meta/android-artifact-url.txt ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "url=$(cat build-meta/android-artifact-url.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "No Android artifact URL from build job — skipping release upload"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Create / update GitHub release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.check.outputs.url }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./mobile/version.json').version")
          BUILD=$(node -p "require('./mobile/version.json').buildNumber")
          TAG="v${VERSION}"
          mkdir -p releases
          EXT="${ARTIFACT_URL%%\?*}"
          EXT="${EXT##*.}"
          if [ -z "$EXT" ] || [ "$EXT" = "$ARTIFACT_URL" ]; then EXT=aab; fi
          ARTIFACT_PATH="releases/sharedmoney-${VERSION}.${EXT}"
          echo "⬇️ Downloading Android artifact..."
          curl -fsSL "$ARTIFACT_URL" -o "$ARTIFACT_PATH"

          # Avoid `cmd | head` / early-exit awk under `pipefail` (SIGPIPE → exit 141).
          PREV_TAG=""
          while IFS= read -r candidate; do
            case "$candidate" in
              "$TAG"|android-*|ios-*) ;;
              *) PREV_TAG="$candidate"; break ;;
            esac
          done < <(git tag --sort=-v:refname)
          {
            echo "## SharedMoney ${VERSION}"
            echo ""
            echo "Build Number: ${BUILD}"
            echo ""
            echo "### Changes"
            if [ -n "$PREV_TAG" ]; then
              git log --oneline --no-merges --format="- %s" -n 30 "${PREV_TAG}..HEAD"
            else
              git log --oneline --no-merges --format="- %s" -n 30 HEAD
            fi
            echo ""
            echo "### Stores"
            echo "- Android/iOS production builds submitted via EAS when those jobs succeed."
          } > /tmp/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading artifact"
            gh release upload "$TAG" "$ARTIFACT_PATH" --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md || true
          else
            gh release create "$TAG" \
              --title "Release ${TAG}" \
              --notes-file /tmp/release-notes.md \
              "$ARTIFACT_PATH"
          fi
          echo "✅ GitHub release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
