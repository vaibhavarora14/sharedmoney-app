# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The npm entries below exist to carry `ignore` rules (which also apply to
# Dependabot security updates). `open-pull-requests-limit: 0` keeps routine
# version-update PRs disabled, so behaviour is otherwise unchanged.
# - vite major: vite 8 is incompatible with @vitejs/plugin-react 5.x (see #403).
# - xcode major: pulled in via @expo/config-plugins; held until Expo moves.
version: 2
updates:
  # Root workspace lockfile (covers mobile + web workspaces).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xcode"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "xcode"
        update-types: ["version-update:semver-major"]
